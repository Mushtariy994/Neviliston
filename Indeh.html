
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Website</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div class="container">

        <div class="content">

            <h1>Stay updated!</h1>

            <p class="description">
                Join 60,000+ product managers receiving monthly
                updates on:
            </p>

            <ul>
                <li>Product discovery and building what matters</li>
                <li>Measuring to ensure updates are a success</li>
                <li>And much more!</li>
            </ul>

            <form>
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="ash@loremcompany.com"
                    required
                >

                <button type="submit">
                    Subscribe to monthly newsletter
                </button>
            </form>

        </div>

        <div class="image-section">

            <div class="browser">
                <div class="browser-header">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="browser-content">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
            </div>

            <div class="chart">
                <svg viewBox="0 0 150 100">
                    <polyline
                        points="5,80 35,50 55,60 85,30 110,40 145,5"
                        fill="none"
                        stroke="#ff694f"
                        stroke-width="5"
                    />
                </svg>
            </div>

            <div class="score">
                <div>94</div>
            </div>

        </div>

    </div>

</body>
</html>
